<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ESPORTE SALVA VIDAS (ESV)</title>
    <link rel="stylesheet" href="assets/css/style.css">

</head>
<body>

    <header>
        <nav>
            <a href="index.html">
                <img src="assets/images/logo_esv.png" alt="Logo ESPORTE SALVA VIDAS">
            </a>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="cadastro.html">Cadastre-se</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1>Entre em Campo: Faça Seu Cadastro!</h1>

        <form action="#" method="POST">

            <fieldset>
                <legend>Seus Dados</legend>

                <div>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required placeholder="Nome e Sobrenome">
                </div>

                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="seu.email@exemplo.com">
                </div>

                <div>
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                </div>

                <div>
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato: 000.000.000-00" maxlength="14" placeholder="000.000.000-00">
                </div>

                <div>
                    <label for="tel">Telefone:</label>
                    <input type="tel" id="tel" name="tel" required pattern="\(\d{2}\) \d{4,5}-\d{4}" title="Formato: (XX) XXXXX-XXXX" placeholder="(XX) 9XXXX-XXXX">
                </div>

            </fieldset>

            <fieldset>
                <legend>Seu Endereço</legend>

                <div>
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" required pattern="\d{5}-\d{3}" title="Formato: 00000-000" maxlength="9" placeholder="00000-000">
                </div>

                <div>
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>
                </div>

                <div>
                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado" required>
                        <option value="">-- Selecione --</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                    </select>
                </div>
            </fieldset>

            <div class="form-actions">
            <button type="submit">Enviar Cadastro</button>
            <button type="reset">Limpar Formulário</button>
            </div>     
        </form>
    </main>

    <footer>
    </footer>

</body>
</html>
